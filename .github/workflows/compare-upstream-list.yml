name: Compare upstream WebRPG index

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compare-upstream-webrpg-index
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compare catalogs
        run: node scripts/compare-upstream-list.mjs
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-comparison
          path: reports/upstream-list-comparison.json
